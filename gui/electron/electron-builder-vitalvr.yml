# Vital Algo: Windows installer, next to VitalVR. Its own appId, folder,
# shortcut and settings (%APPDATA%\dev.vitalvr.VitalAlgo).
# Built by Creer-Installeur-Vital-Algo.bat, which prepares build-vitalvr/.
appId: dev.vitalvr.VitalAlgo
productName: Vital Algo
executableName: VitalAlgo

directories:
  output: dist/vitalalgo

asar: true
asarUnpack:
  - resources/java-version/*.jar

electronLanguages:
  - en-US

files:
  - out/**/*
  - resources/**/*
  - package.json
  - node_modules/**
  - "!node_modules/*/{README,readme,README.md,readme.md,CHANGELOG,CHANGELOG.md,changelog.md}"
  - "!node_modules/*/{test,tests,__tests__,docs,doc,example,examples}"
  - "!node_modules/*/.{git,github,vscode,editorconfig,eslintrc,prettierrc}"
  - "!node_modules/**/*.{map,ts,tsx,d.ts}"
  - "!**/.DS_Store"

win:
  target: nsis
  icon: "./resources/icons/icon.ico"
  extraFiles:
    - from: "../../server/desktop/build/libs/slimevr.jar"
      to: "."
    - from: "../../server/core/resources"
      to: "."
      filter: ["**/*"]
    # Java 17+ for the v21 server, nothing to install
    - from: "./build-vitalvr/jre"
      to: "jre"
    # SteamVR bindings of SlimeVR v21.1.0
    - from: "./build-vitalvr/bindings"
      to: "."
    - from: "./resources/vitalvr/steamvr-autostart.ps1"
      to: "steamvr-autostart.ps1"
# No SteamVR driver here: Vital Algo talks to the SlimeVR v21 driver already
# installed (SteamVR add-on "slimevr_09")

nsis:
  artifactName: "VitalAlgo-Installeur.${ext}"
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: "Vital Algo"
  include: "./resources/vitalvr/installer.nsh"
