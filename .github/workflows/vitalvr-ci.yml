# VitalVR: checks every push (server compile + Kotlin formatting, interface
# lint). Errors show as annotations, readable without opening the logs.
name: VitalVR CI

on:
  push:
  workflow_dispatch:

jobs:
  server:
    name: Server compile + spotless
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v6
      - name: Compile
        shell: bash
        run: |
          set +e
          ./gradlew :server:core:compileKotlin :server:core:compileJava :server:desktop:compileKotlin :server:desktop:shadowJar --console=plain > compile.log 2>&1
          code=$?
          grep -E '^e: |error:|What went wrong' -A2 compile.log | head -40 | while IFS= read -r line; do echo "::error::${line}"; done
          exit $code
      - name: Spotless
        if: always()
        shell: bash
        run: |
          set +e
          ./gradlew :server:spotlessKotlinApply --console=plain > spotless.log 2>&1
          git diff --stat | while IFS= read -r line; do echo "::warning::${line}"; done
          git diff -U0 | grep -E '^[-+@]' | grep -v '^+++\|^---' | head -60 | while IFS= read -r line; do echo "::warning::${line}"; done
          git diff --quiet

  gui:
    name: Interface lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'
      - name: Lint
        shell: bash
        env:
          HUSKY: '0'
        run: |
          set +e
          pnpm i > install.log 2>&1 || { tail -30 install.log; exit 1; }
          pnpm run lint > lint.log 2>&1
          code=$?
          grep -E 'error|warning|\.tsx?' lint.log | head -50 | while IFS= read -r line; do echo "::error::${line}"; done
          exit $code
